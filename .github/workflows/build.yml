name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Complete Flutter App
        run: |
          mkdir -p my_app
          cd my_app
          flutter create --project-name=flosi .
          rm -f lib/main.dart
          cp ../*.dart lib/ 2>/dev/null || true
          if [ -d "../lib" ]; then cp -r ../lib/* lib/ 2>/dev/null || true; fi
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
          
